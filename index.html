<title>آموزش پزشکی در یک نگاه</title>
<style>
:root{
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500;
  --purple:#5856D6; --pink:#FF2D55; --teal:#5AC8FA; --yellow:#FFCC00;
  --bg:#F2F2F7; --card:#FFFFFF; --text:#1C1C1E; --text2:#8E8E93; --text3:#C7C7CC;
  --sep:rgba(60,60,67,.12); --blur:rgba(255,255,255,.72); --fill:rgba(120,120,128,.12);
  --radius:18px; --radius-sm:12px; --shadow:0 2px 12px rgba(0,0,0,.06);
  --shadow-lg:0 8px 30px rgba(0,0,0,.12);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --text:#FFFFFF; --text2:#98989D; --text3:#48484A;
  --sep:rgba(84,84,88,.36); --blur:rgba(28,28,30,.72); --fill:rgba(120,120,128,.24);
  --shadow:0 2px 12px rgba(0,0,0,.3); --shadow-lg:0 8px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;min-height:100vh;transition:background .3s,color .3s}
body{padding-bottom:calc(90px + var(--safe-bottom))}
::-webkit-scrollbar{width:0;height:0}
button,input,select,textarea{font-family:inherit;font-size:inherit}
img{max-width:100%;height:auto}
a{color:var(--blue);text-decoration:none}
::selection{background:rgba(0,122,255,.3)}

/* ===== Layout ===== */
.app{max-width:560px;margin:0 auto;padding:0 16px;animation:pageIn .35s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.navbar{position:sticky;top:0;z-index:100;background:var(--blur);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin:0 -16px 16px;padding-top:calc(12px + var(--safe-top))}
.navbar h1{font-size:17px;font-weight:700;margin:0;line-height:1.2}
.navbar .sub{font-size:11px;color:var(--text2);margin-top:2px}
.nav-btn{background:none;border:0;color:var(--blue);font-size:15px;font-weight:500;cursor:pointer;padding:6px;display:inline-flex;align-items:center;gap:4px}
.nav-btn svg{width:18px;height:18px}

/* ===== Tab Bar ===== */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--blur);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);display:flex;justify-content:space-around;padding:8px 0 calc(8px + var(--safe-bottom));max-width:560px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--text2);font-size:10px;font-weight:500;cursor:pointer;padding:4px;transition:.2s;position:relative}
.tab svg{width:24px;height:24px;stroke-width:1.8;transition:.25s}
.tab.active{color:var(--blue)}
.tab.active svg{stroke:var(--blue);transform:scale(1.08)}
.tab:active{transform:scale(.92)}

/* ===== Cards ===== */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);transition:.25s;animation:fadeIn .35s ease}
.card.clickable{cursor:pointer}
.card.clickable:active{transform:scale(.985)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card-title{font-size:16px;font-weight:700;margin:0 0 8px}
.card-desc{font-size:13px;color:var(--text2);line-height:1.7;margin:0}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.icon-box{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-box svg{width:24px;height:24px;stroke:#fff;stroke-width:2;fill:none}
.icon-box.sm{width:36px;height:36px}
.icon-box.sm svg{width:18px;height:18px}
.bg-blue{background:linear-gradient(135deg,#007AFF,#5856D6)}
.bg-green{background:linear-gradient(135deg,#34C759,#5AC8FA)}
.bg-orange{background:linear-gradient(135deg,#FF9500,#FF2D55)}
.bg-purple{background:linear-gradient(135deg,#5856D6,#FF2D55)}
.bg-red{background:linear-gradient(135deg,#FF3B30,#FF9500)}
.bg-pink{background:linear-gradient(135deg,#FF2D55,#FF9500)}
.bg-teal{background:linear-gradient(135deg,#5AC8FA,#34C759)}
.bg-yellow{background:linear-gradient(135deg,#FFCC00,#FF9500)}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;border:0;border-radius:14px;padding:14px 20px;font-size:15px;font-weight:600;cursor:pointer;width:100%;transition:.2s;box-shadow:0 4px 14px rgba(0,122,255,.25)}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.secondary{background:var(--fill);color:var(--blue);box-shadow:none}
.btn.green{background:var(--green);box-shadow:0 4px 14px rgba(52,199,89,.25)}
.btn.red{background:var(--red);box-shadow:0 4px 14px rgba(255,59,48,.25)}
.btn.orange{background:var(--orange);box-shadow:0 4px 14px rgba(255,149,0,.25)}
.btn.purple{background:var(--purple);box-shadow:0 4px 14px rgba(88,86,214,.25)}
.btn.ghost{background:transparent;color:var(--blue);box-shadow:none;border:1.5px solid var(--blue)}
.btn.sm{padding:9px 14px;font-size:13px;width:auto;border-radius:10px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}

/* ===== Inputs ===== */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;padding-right:4px}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--sep);background:var(--card);color:var(--text);font-size:15px;outline:none;transition:.2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.12)}
.field textarea{min-height:90px;resize:vertical;line-height:1.7;font-family:monospace;font-size:13px}

/* ===== Quiz ===== */
.q-option{display:flex;align-items:center;gap:10px;padding:14px;border-radius:12px;border:1.5px solid var(--sep);margin-bottom:9px;cursor:pointer;transition:.2s;font-size:14px;background:var(--card)}
.q-option:hover{border-color:rgba(0,122,255,.4);background:rgba(0,122,255,.04)}
.q-option.selected{border-color:var(--blue);background:rgba(0,122,255,.08)}
.q-option.correct{border-color:var(--green);background:rgba(52,199,89,.12)}
.q-option.wrong{border-color:var(--red);background:rgba(255,59,48,.1)}
.q-option.disabled{pointer-events:none}
.q-num{width:26px;height:26px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;transition:.2s}
.q-option.selected .q-num{background:var(--blue);color:#fff}
.q-option.correct .q-num{background:var(--green);color:#fff}
.q-option.wrong .q-num{background:var(--red);color:#fff}
.feedback{padding:14px;border-radius:12px;margin-top:12px;font-size:13px;line-height:1.8;animation:slideDown .3s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.feedback.ok{background:rgba(52,199,89,.12);color:#1b7a36;border-right:3px solid var(--green)}
.feedback.no{background:rgba(255,59,48,.1);color:#a12620;border-right:3px solid var(--red)}
[data-theme="dark"] .feedback.ok{color:#7bd693}
[data-theme="dark"] .feedback.no{color:#ff8078}

/* ===== Progress ===== */
.progress{height:8px;background:var(--fill);border-radius:20px;overflow:hidden;margin-top:8px}
.progress > div{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:20px;transition:width .8s cubic-bezier(.25,.8,.25,1);position:relative;overflow:hidden}
.progress > div::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shimmer 2s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.progress.sm{height:4px}

/* ===== List ===== */
.list{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
.list-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:.5px solid var(--sep);cursor:pointer;transition:.15s}
.list-item:last-child{border-bottom:0}
.list-item:active{background:var(--fill)}
.list-item .meta{flex:1;min-width:0}
.list-item .meta h4{margin:0;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .meta p{margin:3px 0 0;font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--text3);flex-shrink:0}
.chev svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5}

/* ===== Badge ===== */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.badge.green{background:rgba(52,199,89,.15);color:#1b7a36}
.badge.blue{background:rgba(0,122,255,.12);color:var(--blue)}
.badge.orange{background:rgba(255,149,0,.15);color:#a05a00}
.badge.red{background:rgba(255,59,48,.12);color:#a12620}
.badge.gray{background:var(--fill);color:var(--text2)}
[data-theme="dark"] .badge.green{color:#7bd693}
[data-theme="dark"] .badge.orange{color:#ffb340}
[data-theme="dark"] .badge.red{color:#ff8078}

/* ===== Stats ===== */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-align:center;transition:.2s}
.stat:active{transform:scale(.97)}
.stat .num{font-size:26px;font-weight:800;color:var(--blue);line-height:1.1}
.stat .lbl{font-size:11.5px;color:var(--text2);margin-top:5px}

/* ===== Segmented ===== */
.seg{display:flex;background:var(--fill);border-radius:11px;padding:3px;margin-bottom:16px;position:relative}
.seg button{flex:1;background:none;border:0;padding:9px;font-size:13px;font-weight:600;border-radius:9px;color:var(--text);cursor:pointer;transition:.25s;z-index:1}
.seg button.active{background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.1)}

/* ===== Content ===== */
.content-body{font-size:14.5px;line-height:2;color:var(--text)}
.content-body h2{font-size:18px;margin:22px 0 10px;color:var(--text);font-weight:700}
.content-body h3{font-size:15.5px;margin:18px 0 8px;color:var(--blue);font-weight:700}
.content-body h4{font-size:14.5px;margin:14px 0 6px;color:var(--text);font-weight:700}
.content-body p{margin:0 0 12px}
.content-body ul,.content-body ol{margin:0 0 14px;padding-right:22px}
.content-body li{margin-bottom:7px}
.content-body table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px;border-radius:12px;overflow:hidden}
.content-body th,.content-body td{border:1px solid var(--sep);padding:9px;text-align:right}
.content-body th{background:var(--fill);font-weight:700}
.content-body blockquote{border-right:3px solid var(--blue);padding:10px 14px;margin:12px 0;background:rgba(0,122,255,.06);border-radius:8px;color:var(--text2);font-style:italic}
.content-body .note{background:rgba(0,122,255,.08);border-right:3px solid var(--blue);padding:12px;border-radius:10px;margin:12px 0;font-size:13.5px}
.content-body code{background:var(--fill);padding:2px 6px;border-radius:5px;font-size:12.5px;font-family:monospace}
.content-body img{border-radius:12px;margin:10px 0}

/* ===== Modal ===== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.3s;backdrop-filter:blur(4px)}
.modal-bg.show{opacity:1;pointer-events:auto}
.modal{background:var(--card);border-radius:24px 24px 0 0;padding:22px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:.35s cubic-bezier(.25,.8,.25,1)}
.modal-bg.show .modal{transform:none}
.modal-handle{width:38px;height:5px;background:var(--text3);border-radius:3px;margin:0 auto 16px}

/* ===== Toast ===== */
.toast{position:fixed;top:calc(20px + var(--safe-top));left:50%;transform:translateX(-50%) translateY(-100px);background:rgba(0,0,0,.88);color:#fff;padding:12px 22px;border-radius:14px;font-size:13.5px;font-weight:500;z-index:1000;transition:.4s cubic-bezier(.25,.8,.25,1);backdrop-filter:blur(20px);max-width:88%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:rgba(52,199,89,.95)}
.toast.error{background:rgba(255,59,48,.95)}

/* ===== Ring ===== */
.ring{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1s ease}

/* ===== Misc ===== */
.center{text-align:center}
.muted{color:var(--text2);font-size:12.5px}
.mt{margin-top:14px} .mb{margin-bottom:14px}
.hidden{display:none!important}
.hero{border-radius:22px;padding:22px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
.hero h2{margin:0 0 6px;font-size:19px;font-weight:700}
.hero p{margin:0;font-size:13px;opacity:.92;line-height:1.7}
.hero::after{content:'';position:absolute;top:-40px;left:-40px;width:130px;height:130px;background:rgba(255,255,255,.12);border-radius:50%;animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,20px)}}

.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0}
.empty{text-align:center;padding:48px 20px;color:var(--text2)}
.empty .empty-icon{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--text3)}
.empty .empty-icon svg{width:26px;height:26px}
.empty p{margin:0 0 4px;font-size:14.5px;font-weight:500}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--fill);border-top-color:var(--blue);animation:spin .7s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-state{text-align:center;padding:44px 20px;color:var(--text2)}
.loading-state p{margin:14px 0 0;font-size:13.5px}
.empty svg{width:60px;height:60px;stroke:var(--text2);stroke-width:1.2;fill:none;margin-bottom:12px;opacity:.5}

/* Bars */
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding:10px 0;justify-content:center}
.bar{flex:1;max-width:60px;background:linear-gradient(180deg,var(--blue),var(--purple));border-radius:8px 8px 0 0;position:relative;transition:.6s cubic-bezier(.25,.8,.25,1);opacity:.9;min-height:4px}
.bar:hover{opacity:1}
.bar span{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:10px;color:var(--text2)}

/* Install Banner */
.install-banner{position:fixed;bottom:calc(100px + var(--safe-bottom));left:16px;right:16px;max-width:520px;margin:0 auto;background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:12px;z-index:150;animation:slideUp .4s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* Loading */
.skeleton{background:linear-gradient(90deg,var(--fill) 25%,rgba(120,120,128,.06) 50%,var(--fill) 75%);background-size:200% 100%;animation:loading 1.5s infinite;border-radius:8px}
@keyframes loading{0%{background-position:200% 0}100%{background-position:-200% 0}}

.spinner{width:32px;height:32px;border:3px solid var(--fill);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* Streak */
.streak{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#FF9500,#FF2D55);color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}

/* Switch */
.switch{position:relative;display:inline-block;width:51px;height:31px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background-color:var(--text3);transition:.3s;border-radius:31px}
.slider:before{position:absolute;content:"";height:27px;width:27px;left:2px;bottom:2px;background-color:white;transition:.3s;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.2)}
input:checked + .slider{background-color:var(--green)}
input:checked + .slider:before{transform:translateX(20px)}

/* Subject chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0;margin-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;background:var(--card);border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer;border:1.5px solid var(--sep);transition:.2s;color:var(--text2)}
.chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}

/* Comparison table */
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.compare-card{background:var(--card);border-radius:14px;padding:14px;text-align:center}
.compare-card .val{font-size:22px;font-weight:800;margin:6px 0}
.compare-card .lbl{font-size:11px;color:var(--text2)}

/* Search */
.search-box{position:relative;margin-bottom:14px}
.search-box input{width:100%;padding:12px 40px 12px 14px;border-radius:12px;border:1px solid var(--sep);background:var(--card);color:var(--text);font-size:14px;outline:none}
.search-box input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.12)}
.search-box svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--text2);fill:none;stroke-width:2}

/* Print */
@media print{.tabbar,.navbar,.install-banner{display:none}}
</style>
</head>
<body>

<div id="app"></div>
<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<!-- Data files -->
<script src="book-part1.js"></script>
<script src="book-part2.js"></script>
<script src="book-part3.js"></script>
<script src="book-part4.js"></script>
<script src="questions-part1.js"></script>
<script src="questions-part2.js"></script>
<script src="questions-part3.js"></script>
<script src="questions-part4.js"></script>
<script src="questions-part5.js"></script>

<script>
/* ================= DATA AGGREGATION ================= */
const BOOK = {
  meta: (typeof BOOK_PART1!=='undefined' && BOOK_PART1.meta) || {},
  topics: [
    ...((typeof BOOK_PART1!=='undefined' && BOOK_PART1.topics) || []),
    ...((typeof BOOK_PART2!=='undefined' && BOOK_PART2.topics) || []),
    ...((typeof BOOK_PART3!=='undefined' && BOOK_PART3.topics) || []),
    ...((typeof BOOK_PART4!=='undefined' && BOOK_PART4.topics) || [])
  ],
  chapters: [

/* ================= API (Cloudflare Pages Functions + D1) ================= */
const LS = {
  get(k,d){try{const v=localStorage.getItem('med_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('med_'+k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem('med_'+k)}catch(e){}}
};
let AUTH_TOKEN = LS.get('token', null);
function setToken(t){ AUTH_TOKEN=t; if(t) LS.set('token',t); else LS.del('token'); }

async function api(path, opts={}){
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(AUTH_TOKEN) headers['Authorization'] = 'Bearer '+AUTH_TOKEN;
  let res;
  try{
    res = await fetch('/api'+path, Object.assign({}, opts, {headers}));
  }catch(netErr){
    throw new Error('اتصال به سرور برقرار نشد. اتصال اینترنت را بررسی کنید.');
  }
  let data=null;
  try{ data = await res.json(); }catch(e){ /* پاسخ غیر-JSON (مثلاً CSV) */ }
  if(!res.ok){ throw new Error((data&&data.error)||('خطای سرور ('+res.status+')')); }
  return data!==null ? data : res;
}
// درخواستی که پاسخ آن فایل (CSV) است، نه JSON
async function apiBlob(path){
  const headers={};
  if(AUTH_TOKEN) headers['Authorization']='Bearer '+AUTH_TOKEN;
  const res=await fetch('/api'+path,{headers});
  if(!res.ok){ let d=null; try{d=await res.json();}catch(e){} throw new Error((d&&d.error)||('خطای سرور ('+res.status+')')); }
  return res.blob();
}

/* داده‌های شخصی کاربر را از سرور می‌خواند و ST را پر می‌کند (هنگام ورود/بارگذاری صفحه) */
async function hydrateFromServer(){
  const data = await api('/me');
  ST.user = data.user;
  ST.progress = data.progress || {};
  // سرور فیلد user را در هر ردیف برنمی‌گرداند (چون کل بسته مال همین کاربر است)؛
  // برای سازگاری با کدی که در جاهای دیگر r.user===ST.user.username را چک می‌کند اضافه می‌کنیم
  ST.results = (data.results || []).map(r => ({ ...r, user: data.user.username }));
  ST.sus = (data.sus || []).map(s => ({ ...s, user: data.user.username }));
  ST.sessions = (data.sessions || []).map(s => ({ ...s, user: data.user.username }));
  ST.bookmarks = data.bookmarks || {};
}

/* ================= UTILS ================= */
const fa = n => String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
function toast(msg,dur=2400,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show '+type;
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),dur);
}
function vibrate(p=10){ if(navigator.vibrate) try{navigator.vibrate(p)}catch(e){} }
function now(){return Date.now()}
function fmtDate(ts){
  if(!ts) return '—';
  const d=new Date(ts); const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} - ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtDur(ms){
  const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60);
  if(h) return `${fa(h)} ساعت و ${fa(m)} دقیقه`;
  return `${fa(m)} دقیقه`;
}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function uid(){return 'u'+Date.now()+Math.floor(Math.random()*9999)}
function shuffle(a){const arr=[...a];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}

/* ================= PROGRESS =================
   ST.progress/results/sus/bookmarks/sessions همیشه فقط داده‌های همین کاربر را
   دارند (از سرور با /me گرفته می‌شوند)؛ تغییرات ابتدا محلی اعمال می‌شود
   (برای واکنش فوری UI) سپس در پس‌زمینه به سرور فرستاده می‌شود. */
function userProgress(){
  return ST.progress;
}
function markViewed(chId){
  const up=userProgress();
  if(!up[chId]) up[chId]={viewed:false,read:false,lastScore:null,answers:null};
  if(!up[chId].viewed){ up[chId].viewed=true; up[chId].viewedAt=now(); }
  up[chId].lastActivity=now();
  api('/progress',{method:'POST',body:JSON.stringify({chapterId:chId,action:'viewed'})})
    .catch(err=>toast('خطا در ذخیره پیشرفت: '+err.message,'','error'));
}
function markRead(chId){
  const up=userProgress();
  if(!up[chId]) up[chId]={viewed:true,read:false,lastScore:null};
  up[chId].read=true; up[chId].readAt=now();
  api('/progress',{method:'POST',body:JSON.stringify({chapterId:chId,action:'read'})})
    .catch(err=>toast('خطا در ذخیره پیشرفت: '+err.message,'','error'));
}
function saveQuizScore(chId,score,total,answers){
  const up=userProgress();
  up[chId]=up[chId]||{};
  const pct=Math.round(score/total*100);
  up[chId].lastScore={score,total,pct};
  up[chId].answers=answers;
  up[chId].quizAt=now();
  ST.results.push({user:ST.user.username,type:'chapter',chapter:chId,score,total,pct,ts:now()});
  api('/quiz-result',{method:'POST',body:JSON.stringify({type:'chapter',chapterId:chId,score,total,answers})})
    .catch(err=>toast('خطا در ثبت نمره: '+err.message,'','error'));
}
function saveTestResult(type,score,total,details){
  const pct=Math.round(score/total*100);
  ST.results.push({user:ST.user.username,type,score,total,pct,details,ts:now()});
  api('/quiz-result',{method:'POST',body:JSON.stringify({type,score,total,answers:details})})
    .catch(err=>toast('خطا در ثبت نمره: '+err.message,'','error'));
}
function overallProgress(){
  if(!ST.user) return {done:0,total:BOOK.chapters.length,pct:0};
  const up=userProgress();
  const done=BOOK.chapters.filter(c=>up[c.id]&&up[c.id].read).length;
  const total=BOOK.chapters.length||1;
  return {done,total:BOOK.chapters.length,pct:Math.round(done/total*100)};
}
function getStreak(){
  const sessions=ST.sessions.filter(s=>ST.user&&s.user===ST.user.username);
  if(!sessions.length) return 0;
  const days=new Set(sessions.map(s=>new Date(s.ts).toDateString()));
  let streak=0;
  const today=new Date();
  for(let i=0;i<365;i++){
    const d=new Date(today); d.setDate(d.getDate()-i);
    if(days.has(d.toDateString())) streak++;
    else if(i>0) break;
  }
  return streak;
}

/* ================= LEARN ================= */
views.learn=function(){
  const up=userProgress();
  const topics=BOOK.topics;
  let html=`<div class="seg" style="margin-top:0">
    <button class="active" data-ltab="list">فهرست فصل‌ها</button>
    <button data-ltab="topics">موضوعات</button>
  </div>`;

  html+=`<div data-lcontent="list">`;
  html+=`<div class="search-box"><input id="chSearch" placeholder="جستجو در فصل‌ها..." oninput="filterChapters(this.value)"><svg viewBox="0 0 24 24">${I.search.replace(/<\/?svg[^>]*>/g,'')}</svg></div>`;
  html+=`<div id="chaptersList">`;
  topics.forEach(tp=>{
    html+=`<h3 style="font-size:13px;color:var(--text2);margin:18px 4px 8px;font-weight:600">${esc(tp.title)}</h3><div class="list">`;
    tp.chapters.forEach(cid=>{
      const ch=resolveChapter(cid); if(!ch) return;
      html+=renderChapterItem(ch,up);
    });
    html+=`</div>`;
  });
  html+=`</div></div>`;

  html+=`<div data-lcontent="topics" class="hidden">`;
  BOOK.topics.forEach(tp=>{
    const chs=tp.chapters.map(resolveChapter).filter(Boolean);
    const done=chs.filter(ch=>up[ch.id]&&up[ch.id].read).length;
    const pct=chs.length?Math.round(done/chs.length*100):0;
    html+=`<div class="card">
      <div class="row"><div class="icon-box bg-blue">${I.book}</div><div style="flex:1">
        <h4 style="margin:0;font-size:15px">${esc(tp.title)}</h4>
        <p class="muted" style="margin:3px 0 0">${fa(done)} از ${fa(chs.length)} فصل</p>
        <div class="progress"><div style="width:${pct}%"></div></div>
      </div></div>
    </div>`;
  });
  html+=`</div>`;
  return html;
};
// در فایل‌های کتاب، فهرست فصل‌های هر «بخش» (topic) گاهی با شماره‌ی فصل (عدد)
// و گاهی با شناسه‌ی رشته‌ای ("ch1") ثبت شده؛ این تابع هر دو حالت را تشخیص می‌دهد
function resolveChapter(ref){
  return BOOK.chapters.find(x=>x.id===ref || x.id==='ch'+ref || x.num===ref) || null;
}

function renderChapterItem(ch,up){
  const pr=up[ch.id]||{};
  const status = pr.read ? '<span class="badge green">خوانده شده</span>' :
                 pr.viewed ? '<span class="badge orange">در حال مطالعه</span>' :
                 '<span class="badge blue">جدید</span>';
  const score = pr.lastScore ? `<span class="badge blue" style="margin-right:4px">${fa(pr.lastScore.pct)}٪</span>` : '';
  const isBookmarked = !!ST.bookmarks[ch.id];
  return `<div class="list-item" data-chid="${ch.id}" data-title="${esc(ch.title)}" onclick="nav('chapter','${ch.id}')">
    <div class="icon-box sm" style="background:${ch.color||'#007AFF'}"><span style="color:#fff;font-weight:700;font-size:13px">${fa(ch.num)}</span></div>
    <div class="meta"><h4>${esc(ch.title)}${isBookmarked?' ★':''}</h4><p>${esc(ch.summary||'')}</p></div>
    ${status}${score}
  </div>`;
}

function filterChapters(q){
  q=q.trim().toLowerCase();
  document.querySelectorAll('#chaptersList [data-chid]').forEach(el=>{
    if(!q){ el.style.display=''; return; }
    const t=(el.dataset.title||'').toLowerCase();
    el.style.display = t.includes(q) ? '' : 'none';
  });
}

/* ================= CHAPTER ================= */
views.chapter=function(){
  const ch=BOOK.chapters.find(c=>c.id===ST._arg);
  if(!ch) return emptyState(I.book,'فصل یافت نشد','<button class="btn" onclick="nav(\'learn\')">بازگشت</button>');
  ST.currentChapter=ch;
  markViewed(ch.id);
  const up=userProgress()[ch.id]||{};
  const quiz=QUESTIONS.chapterQuizzes[ch.id];
  const isBookmarked = !!ST.bookmarks[ch.id];
  let media='';
  if(ch.content&&ch.content.media){
    ch.content.media.forEach(m=>{
      if(m.type==='image') media+=`<div class="card" style="padding:0;overflow:hidden"><img src="${m.src}" alt="${esc(m.alt||'')}" loading="lazy"/><p class="muted" style="padding:10px 14px;margin:0">${esc(m.caption||'')}</p></div>`;
      else if(m.type==='video') media+=`<div class="card" style="padding:0;overflow:hidden"><video controls src="${m.src}" style="width:100%;display:block"></video><p class="muted" style="padding:10px 14px;margin:0">${esc(m.caption||'')}</p></div>`;
      else if(m.type==='audio') media+=`<div class="card"><p style="margin:0 0 8px;font-weight:600">${esc(m.caption||'فایل صوتی')}</p><audio controls src="${m.src}" style="width:100%"></audio></div>`;
    });
  }
  const contentHtml = (ch.content&&ch.content.html) || '<p>محتوای این فصل در دسترس نیست.</p>';
  return `
    <div class="hero" style="background:linear-gradient(135deg,${ch.color||'#007AFF'},#5856D6)">
      <div class="row" style="align-items:flex-start">
        <div style="background:rgba(255,255,255,.22);width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0">${fa(ch.num)}</div>
        <div style="flex:1"><h2 style="margin:0 0 4px;font-size:17px">${esc(ch.title)}</h2><p style="margin:0">${esc(ch.summary||'')}</p></div>
        <button class="nav-btn" style="color:#fff;font-size:20px;padding:0" onclick="toggleBookmark('${ch.id}')" title="نشان‌گذاری">${isBookmarked?'★':'☆'}</button>
      </div>
    </div>
    ${media}
    <div class="card content-body">${contentHtml}</div>
    <div class="card" style="background:rgba(0,122,255,.06);box-shadow:none">
      <button class="btn green" onclick="markRead('${ch.id}');toast('فصل به عنوان خوانده‌شده ثبت شد ✓','','success');render()">
        ${up.read?'✓ خوانده شده (به‌روزرسانی)':'علامت‌گذاری به عنوان خوانده‌شده'}
      </button>
    </div>
    ${quiz?`
      <div class="card">
        <h4 style="margin:0 0 8px;font-size:15px">آزمون این فصل</h4>
        <p class="muted" style="margin:0 0 12px">${fa(quiz.questions.length)} سوال چهارگزینه‌ای با بازخورد فوری</p>
        ${up.lastScore?`<div class="feedback ok" style="margin-bottom:10px">آخرین نمره شما: <b>${fa(up.lastScore.pct)}٪</b> (${fa(up.lastScore.score)} از ${fa(up.lastScore.total)})</div>`:''}
        <button class="btn" onclick="startQuiz('${ch.id}')">${up.lastScore?'تکرار آزمون':'شروع آزمون فصل'}</button>
      </div>
    `:''}
  `;
};

function toggleBookmark(id){
  const nowBookmarked = !ST.bookmarks[id];
  if(nowBookmarked) ST.bookmarks[id]=true; else delete ST.bookmarks[id];
  render();
  toast(nowBookmarked?'به نشان‌شده‌ها اضافه شد ★':'از نشان‌شده‌ها حذف شد');
  api('/bookmark',{method:'POST',body:JSON.stringify({chapterId:id,bookmarked:nowBookmarked})})
    .catch(err=>toast('خطا در ذخیره نشان: '+err.message,'','error'));
}

/* ================= QUIZ ENGINE ================= */
function startQuiz(chId){
  const quiz=QUESTIONS.chapterQuizzes[chId];
  if(!quiz||!quiz.questions||!quiz.questions.length) return toast('آزمونی برای این فصل ثبت نشده','','error');
  ST.quizState={
    chId,
    questions:shuffle([...quiz.questions]),
    idx:0, answers:[], score:0, mode:'chapter'
  };
  nav('quiz');
}

views.quiz=function(){
  const st=ST.quizState;
  if(!st) return emptyState(I.doc,'آزمونی فعال نیست','<button class="btn" onclick="nav(\'learn\')">بازگشت به آموزش</button>');
  if(st.idx>=st.questions.length) return quizResultView();
  const q=st.questions[st.idx];
  const total=st.questions.length;
  const pct=Math.round(st.idx/total*100);
  const answered=st.answers[st.idx];
  const modeLabel = st.mode==='chapter'?'آزمون فصل':st.mode==='pretest'?'پیش‌آزمون':'پس‌آزمون';
  return `
    <div class="progress sm" style="margin-bottom:8px"><div style="width:${pct}%"></div></div>
    <p class="muted center" style="margin:0 0 14px">${modeLabel} — سوال ${fa(st.idx+1)} از ${fa(total)}</p>
    <div class="card">
      <h3 style="font-size:15.5px;line-height:1.9;margin:0 0 16px">${esc(q.q)}</h3>
      ${q.options.map((opt,i)=>{
        let cls='';
        if(answered!==undefined){
          if(i===q.correct) cls='correct disabled';
          else if(i===answered) cls='wrong disabled';
          else cls='disabled';
        }
        return `<div class="q-option ${cls}" ${answered===undefined?`onclick="answerQuiz(${i})"`:''}>
          <span class="q-num">${fa(i+1)}</span><span>${esc(opt)}</span>
        </div>`;
      }).join('')}
      ${answered!==undefined?`
        <div class="feedback ${answered===q.correct?'ok':'no'}">
          <b>${answered===q.correct?'✓ پاسخ صحیح!':'✗ پاسخ نادرست'}</b>
          ${q.explain?'<br>'+esc(q.explain):''}
          ${answered!==q.correct?`<br><br><b>پاسخ صحیح:</b> ${esc(q.options[q.correct])}`:''}
        </div>
        <button class="btn mt" onclick="nextQuiz()">${st.idx+1<total?'سوال بعدی':'مشاهده نتیجه'}</button>
      `:''}
    </div>
  `;
};
function answerQuiz(i){
  const st=ST.quizState; const q=st.questions[st.idx];
  st.answers[st.idx]=i;
  if(i===q.correct) st.score++;
  vibrate(i===q.correct?15:[20,40,20]);
  render();
}
function nextQuiz(){
  const st=ST.quizState; st.idx++;
  if(st.idx>=st.questions.length){
    if(st.mode==='chapter'){
      saveQuizScore(st.chId,st.score,st.questions.length,st.answers);
    }else if(st.mode==='pretest'){
      saveTestResult('pretest',st.score,st.questions.length,st.answers);
    }else if(st.mode==='posttest'){
      saveTestResult('posttest',st.score,st.questions.length,st.answers);
    }
  }
  render();
}
function quizResultView(){
  const st=ST.quizState;
  const total=st.questions.length;
  const pct=Math.round(st.score/total*100);
  const color=pct>=80?'#34C759':pct>=50?'#FF9500':'#FF3B30';
  const title=st.mode==='chapter'?'نتیجه آزمون فصل':st.mode==='pretest'?'نتیجه پیش‌آزمون':'نتیجه پس‌آزمون';
  const incorrect=st.questions.map((q,i)=>({q,i,a:st.answers[i]})).filter(x=>x.a!==x.q.correct);
  const circumference=2*Math.PI*62;
  const backTarget = st.mode==='chapter' ? `nav('chapter','${st.chId}')` : `nav('home')`;
  return `
    <div class="card center">
      <div style="position:relative;display:inline-block">
        <svg class="ring" width="150" height="150">
          <circle cx="75" cy="75" r="62" stroke="var(--fill)"/>
          <circle cx="75" cy="75" r="62" stroke="${color}" stroke-dasharray="${circumference}" stroke-dashoffset="${circumference}"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column">
          <div style="font-size:34px;font-weight:800;color:${color}">${fa(pct)}٪</div>
          <div class="muted">${fa(st.score)} از ${fa(total)}</div>
        </div>
      </div>
      <h3 style="margin:14px 0 6px">${title}</h3>
      <p class="muted">${pct>=80?'عملکرد عالی! 🎉':pct>=50?'عملکرد قابل قبول':'نیاز به مطالعه بیشتر'}</p>
    </div>
    ${incorrect.length?`
      <div class="card">
        <h4 style="margin:0 0 10px;font-size:15px">مرور پاسخ‌های نادرست (${fa(incorrect.length)})</h4>
        ${incorrect.map(x=>`
          <div style="border-bottom:.5px solid var(--sep);padding:10px 0">
            <p style="margin:0 0 6px;font-weight:600;font-size:13.5px">${esc(x.q.q)}</p>
            <p style="margin:0;font-size:12.5px;color:#a12620">پاسخ شما: ${esc(x.q.options[x.a]||'—')}</p>
            <p style="margin:4px 0 0;font-size:12.5px;color:#1b7a36">پاسخ صحیح: ${esc(x.q.options[x.q.correct])}</p>
            ${x.q.explain?`<p class="muted" style="margin:4px 0 0;font-size:12px">${esc(x.q.explain)}</p>`:''}
          </div>
        `).join('')}
      </div>
    `:''}
    <button class="btn" onclick="${backTarget}">بازگشت</button>
  `;
}

/* ================= PRE / POST TEST ================= */
function startPreTest(){
  if(ST.results.find(r=>r.user===ST.user.username&&r.type==='pretest')){
    if(!confirm('شما قبلاً پیش‌آزمون را انجام داده‌اید. آیا می‌خواهید دوباره شرکت کنید؟')) return;
  }
  const bank=QUESTIONS.pretest;
  if(!bank.length) return toast('بانک سوال پیش‌آزمون خالی است','','error');
  const count=Math.min(QUESTIONS.pretestCount,bank.length);
  ST.quizState={
    chId:'pretest',

  if(!bank.length) return toast('بانک سوال پس‌آزمون خالی است','','error');

    chId:'posttest',
    questions:shuffle(bank).slice(0,count),
    idx:0, answers:[], score:0, mode:'posttest'
  };
  nav('quiz');
}

      </div>`;
  }
  return `<div class="hero" style="background:linear-gradient(135deg,#5856D6,#FF2D55)">
    <h2>پرسشنامه SUS</h2>
    <p>ارزیابی کاربردپذیری اپلیکیشن. ۱۰ سوال با مقیاس لیکرت ۱ تا ۵.</p>
  </div>
    <div id="susForm">
    ${QUESTIONS.sus.map((q,i)=>`
      <div class="card" data-suscard="${i}">
        <p style="margin:0 0 10px;font-size:14px;line-height:1.8"><b>${fa(i+1)}.</b> ${esc(q.text)}</p>
        <div style="display:flex;gap:6px">
          ${[1,2,3,4,5].map(v=>`<button class="sus-opt btn secondary sm" data-q="${i}" data-v="${v}" style="flex:1;padding:10px 0" onclick="setSus(${i},${v})">${fa(v)}</button>`).join('')}
        </div>
        <div class="muted" style="text-align:center;margin-top:6px;font-size:10.5px">${i%2===0?'کاملاً مخالفم ← → کاملاً موافقم':'کاملاً موافقم ← → کاملاً مخالفم'}</div>
      </div>
    `).join('')}
    </div>
    <button class="btn green" onclick="submitSUS()">ثبت پرسشنامه و محاسبه امتیاز</button>
  `;
};
function setSus(qi,v){
  ST.susAnswers[qi]=v;
  document.querySelectorAll(`.sus-opt[data-q="${qi}"]`).forEach(b=>{
    const active=+b.dataset.v===v;
    b.classList.toggle('secondary',!active);
    b.style.background = active ? 'var(--blue)' : '';
    b.style.color = active ? '#fff' : '';
  });
  vibrate(8);
}
async function submitSUS(){
  const ans=[];
  for(let i=0;i<QUESTIONS.sus.length;i++){
    if(!ST.susAnswers[i]) return toast('لطفاً به همه سوالات پاسخ دهید','','error');
    ans.push(ST.susAnswers[i]);
  }
  try{
    const data=await api('/sus',{method:'POST',body:JSON.stringify({answers:ans})});
    ST.sus.push({user:ST.user.username,answers:ans,score:data.score,ts:now()});
    ST.susAnswers={};
    toast('پرسشنامه ثبت شد. امتیاز: '+fa(data.score.toFixed(1)),'','success');
    nav('home');
  }catch(err){ toast(err.message,'','error'); }
}

async function adminTab(t){
  const el=document.getElementById('adminTab');
  if(!el){ render(); setTimeout(()=>adminTab(t),50); return; }
  el.innerHTML=loadingState();
  try{
    if(t==='users') el.innerHTML=await adminUsersHTML();
    else if(t==='content') el.innerHTML=adminContentHTML();
    else if(t==='questions') el.innerHTML=adminQuestionsHTML();
    else if(t==='results') el.innerHTML=await adminResultsHTML();
    else if(t==='sus') el.innerHTML=await adminSusHTML();
    else if(t==='export') el.innerHTML=adminExportHTML();
  }catch(err){
    el.innerHTML=emptyState('<span style="font-size:22px;font-weight:800">!</span>','خطا: '+err.message);
  }
  el.scrollIntoView({behavior:'smooth',block:'start'});
}

function deleteChapter(id){
  if(!confirm('این فصل حذف شود؟')) return;
  const idx=BOOK.chapters.findIndex(c=>c.id===id);
  if(idx>=0){ BOOK.chapters.splice(idx,1); }
  adminTab('content'); toast('فصل حذف شد (موقت — تا رفرش)','','success');
}
function editChapter(id){
  const ch=id?BOOK.chapters.find(c=>c.id===id):null;
  openModal(`
    <h3 style="margin:0 0 14px">${ch?'ویرایش فصل':'افزودن فصل جدید'}</h3>

    <div class="field"><label>رنگ</label><input id="ech-color" type="color" value="${ch?ch.color||'#007AFF':'#007AFF'}"></div>

      <button class="btn green" style="flex:2" onclick="saveChapter('${id||''}')">ذخیره</button>
    </div>
  `);
}
function saveChapter(id){
  const num=+document.getElementById('ech-num').value;
  const title=document.getElementById('ech-title').value;
  const summary=document.getElementById('ech-sum').value;
  const color=document.getElementById('ech-color').value;
  const html=document.getElementById('ech-html').value;
  if(!title) return toast('عنوان الزامی است','','error');
  if(id){
    const ch=BOOK.chapters.find(c=>c.id===id);
    if(ch){
      Object.assign(ch,{num,title,summary,color});
      ch.content=ch.content||{}; ch.content.html=html;
    }
  }else{
    const newId=document.getElementById('ech-id').value||('ch'+Date.now());
    BOOK.chapters.push({id:newId,num,title,summary,color,content:{html}});
  }
  toast('ذخیره شد (در حافظه موقت)','','success');
  closeModal(); adminTab('content');
}

async function exportCSV(type){
  try{

    a.download=`medical-edu-${type}-${Date.now()}.csv`;

    toast('دانلود شروع شد','','success');
  }catch(err){ toast('خطا: '+err.message,'','error'); }
}
async function copyAdminData(){
  try{
    const [u,r,s]=await Promise.all([api('/admin/users'),api('/admin/results'),api('/admin/sus')]);
    await navigator.clipboard.writeText(JSON.stringify({users:u.users,results:r.results,sus:s.sus},null,2));
    toast('داده‌ها در کلیپ‌بورد کپی شد','','success');
  }catch(err){ toast('خطا در کپی: '+err.message,'','error'); }
}
async function resetAllData(deleteAccountsToo){
  const msg=deleteAccountsToo
    ? 'همه کاربران عادی (غیر از مدیر) و تمام داده‌هایشان برای همیشه حذف می‌شوند. ادامه می‌دهید؟'
    : 'نتایج، پیشرفت و پاسخ‌های SUS همه کاربران برای همیشه پاک می‌شود (حساب‌های کاربری باقی می‌مانند). ادامه می‌دهید؟';
  if(!confirm(msg)) return;
  if(!confirm('این عمل غیرقابل بازگشت است. مطمئن هستید؟')) return;
  try{
    await api('/admin/reset',{method:'POST',body:JSON.stringify({scope:deleteAccountsToo?'all-users':'all'})});
    ST.adminCache={};
    toast('بازنشانی انجام شد','','success');
    adminTab('export');
  }catch(err){ toast('خطا: '+err.message,'','error'); }
}

/* ================= MODAL ================= */
function openModal(html){
  const root=document.getElementById('modalRoot');
  root.innerHTML=`<div class="modal-bg show" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-handle"></div>${html}</div></div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

/* ================= BIND ================= */
function bind(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    const target=b.dataset.tab;
    document.getElementById('authForm').innerHTML = target==='login'?loginForm():registerForm();
  });
  document.querySelectorAll('[data-ltab]').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('[data-ltab]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.querySelectorAll('[data-lcontent]').forEach(x=>x.classList.toggle('hidden',x.dataset.lcontent!==b.dataset.ltab));
  });
}

async function installApp(){

});

/* ================= SERVICE WORKER ================= */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      console.log('SW registered:',reg.scope);
    }).catch(err=>console.log('SW error:',err));
  });
}

/* ================= INIT ================= */
(async function init(){
  applyTheme();
  render(); // نمایش فوری (صفحه ورود یا اسکلت) تا کاربر منتظر شبکه نماند
  try{
    const s=await api('/settings');
    QUESTIONS.pretestCount=s.pretestCount;
    QUESTIONS.posttestCount=s.posttestCount;
  }catch(e){ /* در صورت خطا مقادیر پیش‌فرض (۱۰) باقی می‌مانند */ }
  if(AUTH_TOKEN){
    try{
      await hydrateFromServer();
    }catch(e){
      setToken(null); ST.user=null; // توکن نامعتبر/منقضی‌شده
    }
    ST.sessionLoading=false;
    render();
  }
})();
</script>
</body>
</html>
